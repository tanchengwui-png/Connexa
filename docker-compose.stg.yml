services:
  postgres:
    image: postgres:17-bookworm
    container_name: connexa-stg-postgres
    environment:
      POSTGRES_DB: connexa_staging
      POSTGRES_USER: connexa
      POSTGRES_PASSWORD: connexa-stg-password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - connexa_stg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connexa -d connexa_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connexa-stg-sender
    working_dir: /app
    env_file:
      - .env.staging
    command: sh -lc "npm run sender:service"
    ports:
      - "127.0.0.1:3101:3101"
    volumes:
      - ../data/wwebjs_auth:/app/.wwebjs_auth
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connexa-stg-web
    working_dir: /app
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
    command: sh -lc "npm run start -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      sender:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connexa-stg-worker
    working_dir: /app
    env_file:
      - .env.staging
    command: sh -lc "npm run worker:messages"
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  connexa_stg_postgres_data:
